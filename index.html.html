<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>단어 마스터 - 드래그 수정 최종본</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --primary: #4a90e2; --bg: #f0f2f5; --success: #28a745; }
        body { font-family: sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 20px; margin:0; }
        .app-container { background: white; width: 100%; max-width: 500px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); overflow: hidden; position: relative; }
        
        #secret-header { height: 30px; background: transparent; cursor: default; width: 100%; }
        .tabs { display: flex; background: #333; }
        .tab-btn { flex: 1; padding: 15px; border: none; cursor: pointer; background: #333; color: #ccc; font-weight: bold; }
        .tab-btn.active { background: white; color: var(--primary); border-radius: 10px 10px 0 0; }
        
        .content { padding: 20px; display: none; min-height: 550px; text-align: center; }
        .content.active { display: block; }
        
        .remaining { font-size: 0.9rem; color: #666; background: #eee; padding: 5px 12px; border-radius: 20px; display: inline-block; margin-bottom: 15px; }
        .speaker-icon { font-size: 1.5rem; cursor: pointer; color: var(--primary); border: 1px solid #ddd; border-radius: 50%; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; }
        
        .card { width: 100%; height: 320px; perspective: 1000px; cursor: pointer; margin: 15px 0; }
        .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.6s; transform-style: preserve-3d; }
        .card.flipped .card-inner { transform: rotateY(180deg); }
        .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 15px; border: 2px solid #ddd; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .card-back { transform: rotateY(180deg); background: var(--primary); color: white; border: none; }
        
        .main-btn { background: var(--primary); color: white; width: 100%; padding: 15px; border-radius: 8px; border: none; font-weight: bold; font-size: 1.1rem; margin-top: 10px; cursor: pointer; }
        .cert-btn { background: #2ecc71; color: white; width: 100%; margin-top: 10px; padding: 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }

        .option-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .opt-btn { padding: 15px; border: 1px solid #ddd; border-radius: 8px; background: white; cursor: pointer; font-size: 1rem; font-weight: bold; }
        input[type="text"] { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; margin-top: 10px; box-sizing: border-box; font-size: 1.1rem; text-align: center; }

        /* 결과 리포트 */
        .result-area { padding: 20px; background: white; border-radius: 15px; text-align: center; }
        .report-card { text-align: left; margin-top: 15px; border-top: 1px solid #eee; padding-top: 10px; }
        .result-item { display: flex; justify-content: space-between; padding: 10px; margin-bottom: 5px; border-radius: 8px; border: 1px solid #eee; font-weight: bold; font-size: 0.9rem; }
        .perfect { background: #d4edda; color: #155724; }
        .retry { background: #fff3cd; color: #856404; }
        .attempt-badge { display: block; margin-bottom: 10px; padding: 5px 15px; background: #333; color: white; border-radius: 5px; font-size: 0.9rem; width: fit-content; margin: 0 auto 10px; }

        /* 관리자 설정창 (드래그 존 추가) */
        #admin-overlay { display:none; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: white; z-index: 1000; padding: 25px; box-sizing: border-box; }
        #data-input { width: 100%; height: 200px; margin-bottom: 10px; padding: 10px; box-sizing: border-box; border: 2px solid #ccc; border-radius: 8px; font-size: 0.8rem; transition: 0.3s; }

</head>
<body>

<div class="app-container">
    <div id="secret-header" onclick="triggerAdmin()"></div>
    <div class="tabs">
        <button class="tab-btn active" onclick="openTab(event, 'flash')">단어 카드</button>
        <button class="tab-btn" onclick="openTab(event, 'quiz4')">4지선다</button>
        <button class="tab-btn" onclick="openTab(event, 'write')">주관식</button>
    </div>

    <div id="admin-overlay">

        <textarea id="data-input" placeholder="여기에 파일을 드래그하거나 텍스트를 붙여넣으세요."></textarea>
        <button class="main-btn" onclick="applyData()">저장 및 적용</button>
        <button class="main-btn" onclick="resetCounts()" style="background:#e74c3c;">시험 횟수 초기화</button>
        <button class="main-btn" onclick="closeAdmin()" style="background:#999;">닫기</button>
    </div>

    <div id="flash" class="content active">
        <p class="remaining" id="flash-rem"></p>
        <div id="flash-box">
            <div class="speaker-icon" onclick="speakWord()">🔊</div>
            <div class="card" id="mainCard" onclick="this.classList.toggle('flipped')">
                <div class="card-inner">
                    <div class="card-front"><h1 id="f-word" style="font-size:2.8rem;"></h1></div>
                    <div class="card-back">
                        <h2 id="f-mean" style="font-size:1.8rem;"></h2>
                        <p id="f-ex" style="font-style:italic; margin-top:15px; border-top:1px solid rgba(255,255,255,0.3); padding-top:10px;"></p>
                        <p id="f-ex-ko" style="font-size:0.85rem; opacity:0.8; margin-top:5px;"></p>
                    </div>
                </div>
            </div>
            <button class="main-btn" onclick="submitFlash()">외웠어요!</button>
        </div>
    </div>

    <div id="quiz4" class="content">
        <p class="remaining" id="q4-rem"></p>
        <div id="q4-box">
            <div class="speaker-icon" onclick="speakWord()">🔊</div>
            <h1 id="q4-word" style="font-size:2.5rem; margin-bottom:30px;"></h1>
            <div class="option-grid" id="q4-options"></div>
            <p id="q4-msg" style="margin-top:20px; font-weight:bold; height:24px;"></p>
        </div>
    </div>

    <div id="write" class="content">
        <p class="remaining" id="qw-rem"></p>
        <div id="qw-box">
            <h2 id="qw-mean" style="font-size:2rem; color:var(--primary);"></h2>
            <div style="background:#f9f9f9; padding:15px; border-radius:10px; margin: 15px 0;">
                <p id="qw-ex" style="font-style:italic; margin:0;"></p>
                <p id="qw-ex-ko" style="font-size:0.85rem; color:#888; margin-top:5px;"></p>
            </div>
            <input type="text" id="qw-input" placeholder="영단어를 입력하세요" onkeypress="if(event.keyCode==13) checkWrite()">
            <button class="main-btn" onclick="checkWrite()">정답 확인</button>
            <p id="qw-msg" style="margin-top:15px; font-weight:bold; height:24px;"></p>
        </div>
    </div>
</div>

    "m": "(문제 등을) 다루다, 해결하려고 노력하다",
    "e": "The government must address the water shortage.",
    "k": "정부는 물 부족 문제를 해결하기 위해 노력해야 한다."
  }
];
let vocabulary = JSON.parse(localStorage.getItem('vocab_data')) || defaultData;
    let studyPool = [...vocabulary];
    let quizResults = [];
    let curIdx = -1;
    let currentAttempts = 0;
    let adminClick = 0;
    let stats = JSON.parse(localStorage.getItem('study_stats')) || { quiz4: 0, write: 0 };

    // --- 드래그 앤 드롭 로직 개선 ---
    const dataInput = document.getElementById('data-input');
    
    dataInput.addEventListener('dragover', (e) => {
        e.preventDefault();
        dataInput.classList.add('dragover');
    });

    dataInput.addEventListener('dragleave', () => {
        dataInput.classList.remove('dragover');
    });

    dataInput.addEventListener('drop', (e) => {
        e.preventDefault();
        dataInput.classList.remove('dragover');
        const file = e.dataTransfer.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (event) => {
                dataInput.value = event.target.result;
            };
            reader.readAsText(file);
        }
    });

    function applyData() {
        try {
            const raw = dataInput.value.trim();
            const jsonMatch = raw.match(/\[.*\]/s);
            if (!jsonMatch) throw new Error("JSON 형식이 아닙니다.");
            const parsed = JSON.parse(jsonMatch[0]);
            localStorage.setItem('vocab_data', JSON.stringify(parsed));
            alert("데이터가 성공적으로 저장되었습니다!");
            location.reload();
        } catch(e) {
            alert("데이터를 읽는 중 오류가 발생했습니다. 형식을 확인해주세요.");
        }
    }

    // --- 나머지 기능 로직 (기존과 동일하되 누락 없이 통합) ---
    function openTab(evt, name) {
        document.querySelectorAll(".content").forEach(c => c.style.display = "none");
        document.querySelectorAll(".tab-btn").forEach(t => t.classList.remove("active"));
        document.getElementById(name).style.display = "block";
        evt.currentTarget.classList.add("active");
        studyPool = [...vocabulary];
        quizResults = [];
        if(name === 'flash') setupFlash();
        if(name === 'quiz4') setupQuiz4();
        if(name === 'write') setupWrite();
    }

    function setupFlash() {
        if (studyPool.length === 0) { document.getElementById('flash-box').innerHTML = "<h2>🎉 학습 완료!</h2>"; return; }
        const card = document.getElementById('mainCard');
        card.classList.remove('flipped');
        document.getElementById('flash-rem').innerText = `남은 단어: ${studyPool.length}`;
        curIdx = Math.floor(Math.random() * studyPool.length);
        const item = studyPool[curIdx];
        document.getElementById('f-word').innerText = item.w;
        document.getElementById('f-mean').innerText = item.m;
        document.getElementById('f-ex').innerText = item.e || "";
        document.getElementById('f-ex-ko').innerText = item.k || "";
        speakWord();
    }
    function submitFlash() { studyPool.splice(curIdx, 1); setupFlash(); }

    function setupQuiz4() {
        if (studyPool.length === 0) { showReport('q4-box', 'quiz4'); return; }
        document.getElementById('q4-rem').innerText = `남은 문제: ${studyPool.length}`;
        document.getElementById('q4-msg').innerText = "";
        currentAttempts = 0;
        curIdx = Math.floor(Math.random() * studyPool.length);
        const cor = studyPool[curIdx];
        document.getElementById('q4-word').innerText = cor.w;
        let opts = [cor.m];
        while(opts.length < Math.min(4, vocabulary.length)) {
            let r = vocabulary[Math.floor(Math.random() * vocabulary.length)].m;
            if(!opts.includes(r)) opts.push(r);
        }
        opts.sort(() => Math.random() - 0.5);
        document.getElementById('q4-options').innerHTML = opts.map(o => `<button class="opt-btn" onclick="checkQ4('${o}', '${cor.m}')">${o}</button>`).join('');
        speakWord();
    }
    function checkQ4(pick, answer) {
        currentAttempts++;
        if (pick === answer) {
            quizResults.push({ w: studyPool[curIdx].w, status: currentAttempts === 1 ? 'perfect' : 'retry' });
            document.getElementById('q4-msg').innerText = "정답! ✨";
            document.getElementById('q4-msg').style.color = "green";
            setTimeout(() => { studyPool.splice(curIdx, 1); setupQuiz4(); }, 600);
        } else {
            document.getElementById('q4-msg').innerText = "오답입니다!";
            document.getElementById('q4-msg').style.color = "red";
        }
    }

    function setupWrite() {
        if (studyPool.length === 0) { showReport('qw-box', 'write'); return; }
        document.getElementById('qw-rem').innerText = `남은 문제: ${studyPool.length}`;
        document.getElementById('qw-msg').innerText = "";
        document.getElementById('qw-input').value = "";
        currentAttempts = 0;
        curIdx = Math.floor(Math.random() * studyPool.length);
        const item = studyPool[curIdx];
        document.getElementById('qw-mean').innerText = item.m;
        document.getElementById('qw-ex').innerText = item.e ? item.e.replace(new RegExp(item.w, 'gi'), '_____') : "";
        document.getElementById('qw-ex-ko').innerText = item.k || "";
        document.getElementById('qw-input').focus();
    }
    function checkWrite() {
        const val = document.getElementById('qw-input').value.trim().toLowerCase();
        const cor = studyPool[curIdx].w.toLowerCase();
        currentAttempts++;
        if (val === cor) {
            quizResults.push({ w: studyPool[curIdx].w, status: currentAttempts === 1 ? 'perfect' : 'retry' });
            document.getElementById('qw-msg').innerText = "정답! 👏";
            document.getElementById('qw-msg').style.color = "green";
            setTimeout(() => { studyPool.splice(curIdx, 1); setupWrite(); }, 800);
        } else {
            document.getElementById('qw-msg').innerText = currentAttempts >= 2 ? `정답: ${studyPool[curIdx].w}` : "다시 시도!";
            document.getElementById('qw-msg').style.color = "red";
        }
    }

    function showReport(divId, type) {
        stats[type]++;
        localStorage.setItem('study_stats', JSON.stringify(stats));
        let p = quizResults.filter(r => r.status === 'perfect').length;
        let html = `<div id="capture-target" class="result-area"><div class="attempt-badge">총 시험 횟수: ${stats[type]}회</div><h3>📊 인증 리포트</h3><p>완벽: ${p} / 보충: ${quizResults.length-p}</p><div class="report-card">`;
        quizResults.forEach(r => { html += `<div class="result-item ${r.status}"><span>${r.w}</span><span>${r.status.toUpperCase()}</span></div>`; });
        html += `</div><p style="font-size:0.7rem; color:#999; margin-top:10px;">시각: ${new Date().toLocaleString()}</p></div><button class="cert-btn" onclick="saveAsImage()">📸 이미지 저장</button><button class="main-btn" onclick="location.reload()" style="background:#999;">다시 시작</button>`;
        document.getElementById(divId).innerHTML = html;
    }

    function saveAsImage() {
        const target = document.getElementById('capture-target');
        html2canvas(target, { backgroundColor: "#ffffff", scale: 2 }).then(canvas => {
            const link = document.createElement('a');
            link.download = `인증샷_${new Date().getTime()}.jpg`;
            link.href = canvas.toDataURL('image/jpeg', 0.9);
            link.click();
        });
    }

    function speakWord() {
        const word = studyPool[curIdx]?.w;
        if(word) {
            const url = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(word)}&tl=en&client=tw-ob`;
            new Audio(url).play();
        }
    }

    function triggerAdmin() {
        adminClick++;
        if (adminClick === 3) { document.getElementById('admin-overlay').style.display = 'block'; adminClick = 0; }
        setTimeout(() => { adminClick = 0; }, 500);
    }
    function closeAdmin() { document.getElementById('admin-overlay').style.display = 'none'; }
    function resetCounts() { if(confirm("초기화할까요?")) { stats={quiz4:0,write:0}; localStorage.setItem('study_stats', JSON.stringify(stats)); location.reload(); } }

    window.onload = () => { if(vocabulary.length > 0) setupFlash(); };
</script>
</body>
</html>
